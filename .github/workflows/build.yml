name: Build RaskolProfessions

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build
        run: mvn -B -ntp clean package
      - name: Verify resources
        run: jar tf target/RaskolProfessions-1.0.0.jar | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: RaskolProfessions-jar
          path: target/RaskolProfessions-*.jar
